<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--line2:#3a404c;--txt:#e8eaed;--sub:#9aa0a6;--sub2:#555b66;--btn:#2a2f3a;--inp:#0f1115;--sheet:#1a1d24;--toast:#262b35;--toastb:#39404d;
 --out:#FF8A65;--in:#34D399;--acc:#FFD54A;--today:#1c2130;color-scheme:dark}
html[data-theme=light]{--bg:#f4f5f7;--card:#fff;--line:#e3e5e8;--line2:#cfd3d8;--txt:#1d1f23;--sub:#6b7078;--sub2:#9aa0a6;--btn:#eceef1;--inp:#f7f8fa;--sheet:#fff;--toast:#fff;--toastb:#d9dce1;
 --out:#E8590C;--in:#0F9F6E;--acc:#F5B800;--today:#e9eefb;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;overflow-x:clip;max-width:100%}
body{padding:0 12px calc(env(safe-area-inset-bottom) + 40px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -12px 8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
header{display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:36px;height:34px;font-size:16px;font-weight:700;padding:0 8px}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#666}
.mnav{display:flex;align-items:center;gap:8px;margin-top:8px}
.mnav .mt{flex:1;text-align:center;font-weight:700;font-size:16px}
.mnav button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.mnav .now{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sum .row{display:flex;align-items:baseline;gap:8px}
.sum .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.sum .lbl{font-size:12px;color:var(--sub)}
.sum .sm{display:flex;gap:12px;font-size:13px;margin-top:4px;color:var(--sub)}.sum .sm b{color:var(--txt);font-weight:700}
.bar{height:10px;background:var(--btn);border-radius:6px;overflow:hidden;margin:10px 0 5px;position:relative}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
.bar .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt);opacity:.6}
.bmsg{font-size:12.5px;color:var(--sub)}.bmsg b{color:var(--txt)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:8px;border:1px solid var(--line)}

.cb::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.cb:active{transform:scale(.95)}
.cb .e{font-size:20px;line-height:1.2}.cb .n{font-weight:700;font-size:11px;letter-spacing:-.4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}

.chip.sub{padding:5px 11px;font-size:13px}
.tabs{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px}

.amt{font-weight:700;white-space:nowrap}.amt.out{color:var(--txt)}.amt.in{color:var(--in)}
.empty{text-align:center;color:var(--sub);padding:30px 10px;line-height:1.6}

.btn{background:var(--btn);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--acc);color:#111}.btn.red{background:#e5484d;color:#fff}.btn.w{width:100%}
.hint{font-size:12px;color:var(--sub);margin:6px 0;line-height:1.5;white-space:pre-line}
.fld{display:block;margin-bottom:9px}.fld>span{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.fldrow{display:flex;gap:6px}.fldrow input{flex:1;min-width:0}
.fld input,.fld select{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px}
.pen{background:var(--btn);border:0;border-radius:8px;width:44px;flex:0 0 44px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}

.hs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px -2px 10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20;touch-action:none;overscroll-behavior:contain}

.sheet{background:var(--sheet);width:100%;border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}

.sheet-a{display:flex;gap:8px;margin-top:10px}.sheet-a .btn{flex:1;padding:13px}

.qa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:4px 0 6px}
.qa button{background:none;border:1px solid var(--line2);border-radius:8px;padding:6px 0;font-size:13px;font-weight:600}
.npad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px}

.mrow{display:flex;align-items:center;gap:8px;background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:4px 0}
.mrow .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mrow .mt.ph{color:var(--sub2)}
.drow{display:flex;gap:6px;align-items:center;margin:6px 0}
.drow input[type=date]{background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:15px;flex:1;min-width:0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(max(env(safe-area-inset-bottom),24px) + 18px);background:var(--toast);border:1px solid var(--toastb);box-shadow:0 4px 18px rgba(0,0,0,.2);border-radius:14px;padding:11px 13px;z-index:30;display:flex;align-items:center;gap:8px;transform:translateY(160%);opacity:0;pointer-events:none;transition:transform .25s,opacity .2s}

.ib{background:var(--btn);border:0;border-radius:7px;min-width:32px;height:32px;padding:0 7px;flex:0 0 auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cal .d{background:var(--card);border-radius:8px;min-height:58px;padding:4px 3px;display:flex;flex-direction:column;gap:1px;font-size:10.5px;overflow:hidden;border:1.5px solid transparent}
.cal .d .n{font-size:12px;font-weight:700}.cal .d.t{border-color:var(--acc);background:var(--today)}
.cal .d .o{color:var(--out);font-weight:600;white-space:nowrap}.cal .d .i{color:var(--in);font-weight:600;white-space:nowrap}
.cal .d.x{background:none}
.sun{color:#ff6b6b}.sat{color:#5b8def}
svg text{font-family:inherit}
.tgl{display:flex;align-items:center;gap:8px;margin:8px 0}.tgl input{width:22px;height:22px}
.cr{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:12px}.cr code{flex:1;background:var(--inp);padding:5px 7px;border-radius:6px;word-break:break-all}
.ver{text-align:center;color:var(--sub2);font-size:11px;margin-top:10px}
.fx{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.fx:last-of-type{border:0}
.fx .dd{width:42px;text-align:center;font-size:12px;color:var(--sub);font-weight:700}
.fx.off{opacity:.45}
.li.fix{box-shadow:inset 3px 0 0 #8A87C9}.li.fut{opacity:.62}
.bdg{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 5px;margin-right:4px;vertical-align:1px}
.bdg.f{background:#8A87C933;color:#A9A6F0}.bdg.p{background:#FFD54A33;color:#E8B923}
html[data-theme=light] .bdg.f{color:#5E5AB8}html[data-theme=light] .bdg.p{color:#A57C00}
.fxcard{background:var(--card);border:1px solid var(--line);border-left:4px solid #8A87C9;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.fxcard .hd{display:flex;align-items:center;gap:6px;font-weight:700}.fxcard .hd span{flex:1}
.fxr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.fxr .dd{width:34px;font-size:12px;color:var(--sub);font-weight:700}.fxr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxr.fut .nm,.fxr.fut .amt{opacity:.6}.fxr.skip{opacity:.4;text-decoration:line-through}
.fxbanner{background:#8A87C922;border:1px solid #8A87C966;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px}.fxbanner span{flex:1}
.cal .d.sel{border-color:#8A87C9;background:#8A87C933}.cal .d.t.sel{border-color:var(--acc)}
.calday{margin-top:10px}.calday .dh:first-child{margin-top:4px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 0;font-weight:700}
.cal .d .f{font-size:9px;color:#A9A6F0}
</style>
</head>

function goNow(){view=mStart(new Date());calSel=null;refreshView()}
document.querySelectorAll('#kseg button').forEach(b=>b.onclick=()=>{kindSel=b.dataset.k;renderCats()});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;LS.set('bg_tab',tab);if(tab!=='list')catFilter=null;renderTab()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(()=>{if(!document.hidden&&!document.querySelector('.sheet-bg'))refresh()},30000);
// 스와이프로 달 이동 (내역/통계/달력)
{let sx=null,sy=null;document.addEventListener('touchstart',e=>{if(document.querySelector('.sheet-bg')||tab==='settings'){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
 document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)moveMonth(dx<0?1:-1)},{passive:true})}
renderAll();(async()=>{try{if(remote())await loadConfig()}catch(e){setSync('err',e.message)}refresh()})();swReg();
</script>
